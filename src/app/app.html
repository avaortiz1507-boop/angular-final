<div class="flex min-h-screen flex-col bg-transparent text-slate-800">
  <header class="border-b border-pink-200 bg-white/80 backdrop-blur-sm shadow-sm shadow-pink-100/50">
    <div class="mx-auto max-w-6xl px-4 py-6 md:px-6">
      <a routerLink="/" class="block text-center text-3xl font-extrabold tracking-tight text-pink-700 md:text-5xl">
        Inventory Manager
      </a>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 md:px-6 md:py-10">
    <router-outlet />
  </main>

  <nav class="border-t border-pink-200 bg-white/85 backdrop-blur-sm shadow-[0_-10px_30px_rgba(236,72,153,0.08)]">
  <div class="mx-auto flex max-w-6xl items-center justify-center gap-2 px-4 py-3 md:gap-3 md:px-6">

    <a 
      routerLink="/" 
      routerLinkActive="bg-pink-500 text-white shadow-sm" 
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-full px-3 py-2 text-sm font-medium text-pink-700 transition hover:bg-pink-100 md:text-base">
      Home
    </a>

    @if (auth.isLoggedIn()) {
      <a 
        routerLink="/objects" 
        routerLinkActive="bg-blue-500 text-white shadow-sm"
        class="rounded-full px-3 py-2 text-sm font-medium text-blue-700 transition hover:bg-blue-100 md:text-base">
        List
      </a>
    }

    @if (auth.isAdmin()) {
      <a 
        routerLink="/objects/new" 
        routerLinkActive="bg-emerald-500 text-white shadow-sm"
        class="rounded-full px-3 py-2 text-sm font-medium text-emerald-700 transition hover:bg-emerald-100 md:text-base">
        Create
      </a>
    }

    @if (auth.isAdmin()) {
      <a 
        routerLink="/admin" 
        routerLinkActive="bg-indigo-500 text-white shadow-sm"
        class="rounded-full px-3 py-2 text-sm font-medium text-indigo-700 transition hover:bg-indigo-100 md:text-base">
        Admin Panel
      </a>
    }

    @if (!auth.isLoggedIn()) {
      <a 
        routerLink="/login" 
        routerLinkActive="bg-yellow-400 text-slate-800 shadow-sm"
        class="rounded-full px-3 py-2 text-sm font-medium text-yellow-700 transition hover:bg-yellow-100 md:text-base">
        Login
      </a>
    }

    @if (!auth.isLoggedIn()) {
      <a 
        routerLink="/register" 
        routerLinkActive="bg-pink-500 text-white shadow-sm"
        class="rounded-full px-3 py-2 text-sm font-medium text-pink-700 transition hover:bg-pink-100 md:text-base">
        Register
      </a>
    }

  </div>
</nav>
