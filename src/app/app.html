<div class="min-h-screen bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 md:px-6">
      <a routerLink="/" class="text-xl font-bold tracking-tight text-slate-900">Inventory Manager</a>

      <div class="flex items-center gap-2 text-sm font-medium">
        <a routerLink="/" routerLinkActive="bg-slate-900 text-white" [routerLinkActiveOptions]="{ exact: true }" class="rounded-full px-3 py-2 text-slate-700 transition hover:bg-slate-100">Home</a>
        <a routerLink="/objects" routerLinkActive="bg-slate-900 text-white" class="rounded-full px-3 py-2 text-slate-700 transition hover:bg-slate-100">List</a>
        <a routerLink="/objects/new" routerLinkActive="bg-slate-900 text-white" class="rounded-full px-3 py-2 text-slate-700 transition hover:bg-slate-100">Create</a>
        <a routerLink="/login" routerLinkActive="bg-slate-900 text-white" class="rounded-full px-3 py-2 text-slate-700 transition hover:bg-slate-100">Account</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 md:py-10">
    <router-outlet />
  </main>
</div>
